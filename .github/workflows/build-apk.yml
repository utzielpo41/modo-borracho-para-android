name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "modo-borracho (2)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK
        run: yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses || true

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: modo-borracho-apk
          path: "modo-borracho (2)/app/build/outputs/apk/debug/app-debug.apk"
